server:
  port: 8084

spring:
  application:
    name: user-service

  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5435/user_db}
    username: ${USER_DB_USERNAME:user_service_user}
    password: ${USER_DB_PASSWORD:user_service_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 2147483647
      properties:
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 10000
        "[request.timeout.ms]": 3000
        "[max.block.ms]": 5000
        spring.json.add.type.headers: false


springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  kafka:
    topics:
      user-profile-events: user-profile-events
    outbox:
      poll-interval-ms: 1000
      send-timeout-seconds: 15


  security:
    jwt:
      issuer: http://user-service
      audience: api-gateway
      access-token-ttl-seconds: 900
      refresh-token-ttl-days: 30
      private-key-location: ${USER_JWT_PRIVATE_KEY_PATH:file:../secrets/user-service-private.pem}