services:
  post-db:
    image: postgres:16-alpine
    container_name: post-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: post_db
      POSTGRES_USER: post_user
      POSTGRES_PASSWORD: post_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - post-db-data:/var/lib/postgresql/data

  user-db:
    image: postgres:16-alpine
    container_name: user-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_service_user
      POSTGRES_PASSWORD: user_service_password
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service_user -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    container_name: post-service-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: >
        INTERNAL://:19092,
        EXTERNAL://:9092,
        CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka:19092,
        EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: post-service-kafka-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: post-service-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  leaderboard-db:
    image: postgres:16-alpine
    container_name: leaderboard-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: leaderboard_db
      POSTGRES_USER: leaderboard_user
      POSTGRES_PASSWORD: leaderboard_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - leaderboard-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: leaderboard-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - leaderboard-redis-data:/data
    command: redis-server --appendonly yes

  post-service:
    build:
      context: .
      dockerfile: post-service/Dockerfile
    container_name: post-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://post-db:5432/post_db
      SPRING_DATASOURCE_USERNAME: post_user
      SPRING_DATASOURCE_PASSWORD: post_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      - post-db
      - kafka

  leaderboard-service:
    build:
      context: .
      dockerfile: leaderboard-service/Dockerfile
    container_name: leaderboard-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://leaderboard-db:5432/leaderboard_db
      SPRING_DATASOURCE_USERNAME: leaderboard_user
      SPRING_DATASOURCE_PASSWORD: leaderboard_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      - leaderboard-db
      - redis
      - kafka

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    restart: unless-stopped
    environment:
      USER_DB_URL: jdbc:postgresql://user-db:5432/user_db
      USER_DB_USERNAME: user_service_user
      USER_DB_PASSWORD: user_service_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      USER_JWT_PRIVATE_KEY_PATH: file:/run/secrets/user-service-private.pem
    volumes:
      - ./secrets/user-service-private.pem:/run/secrets/user-service-private.pem:ro
    depends_on:
      user-db:
        condition: service_healthy
      kafka:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      USER_SERVICE_URL: http://user-service:8084
      POST_SERVICE_URL: http://post-service:8080
      LEADERBOARD_SERVICE_URL: http://leaderboard-service:8082
      GATEWAY_PUBLIC_KEY_LOCATION: file:/run/secrets/user-service-public.pem
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-[]}
    volumes:
      - ./secrets/user-service-public.pem:/run/secrets/user-service-public.pem:ro
    depends_on:
      - post-service
      - leaderboard-service
      - user-service

volumes:
  post-db-data:
  user-db-data:
  leaderboard-db-data:
  leaderboard-redis-data:
