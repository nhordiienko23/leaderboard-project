server:
  port: 8082

spring:
  application:
    name: leaderboard-service

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s

  datasource:
    url: jdbc:postgresql://localhost:5434/leaderboard_db
    username: leaderboard_user
    password: leaderboard_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: leaderboard-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.value.default.type: com.github.nhordiienko23.leaderboardcontract.event.LeaderboardEvent
        spring.json.trusted.packages: com.github.nhordiienko23.leaderboardcontract.event
        spring.json.use.type.headers: false

leaderboard:
  scoring:
    rules:
      - event-type: POST
        action-type: CREATED
        participant-role: POST_AUTHOR
        points: 10

      - event-type: POST
        action-type: DELETED
        participant-role: POST_AUTHOR
        points: -10

      - event-type: COMMENT
        action-type: CREATED
        participant-role: COMMENT_AUTHOR
        points: 5

      - event-type: COMMENT
        action-type: DELETED
        participant-role: COMMENT_AUTHOR
        points: -5

      - event-type: COMMENT
        action-type: CREATED
        participant-role: CONTENT_AUTHOR
        points: 2

      - event-type: COMMENT
        action-type: DELETED
        participant-role: CONTENT_AUTHOR
        points: -2

      - event-type: LIKE
        action-type: CREATED
        participant-role: CONTENT_AUTHOR
        points: 1

      - event-type: LIKE
        action-type: DELETED
        participant-role: CONTENT_AUTHOR
        points: -1