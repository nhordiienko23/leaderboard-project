server:
  port: 8082
spring:
  application:
    name: leaderboard-service
  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: leaderboard-service
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.value.default.type: com.github.nhordiienko23.leaderboardservice.kafka.PostCreatedEvent
        spring.json.trusted.packages: com.github.nhordiienko23.leaderboardservice.kafka
        spring.json.use.type.headers: false
